name: MF Desktop Build

# Fork-only desktop build. The macOS job runs on the fork's self-hosted Mac
# runner, because hosted macOS arm64 runners are often not available to the
# fork; it cleans its workspace and caches after every build. Every other job
# runs on a GitHub-hosted runner, so a near-daily build never loads the fork's
# servers. Upstream release.yml is gated to block/buzz, so this file owns
# desktop builds for the fork and never conflicts with upstream merges.
#
# Trigger: push tag desktop-v<X.Y.Z>-mf.<N>, or run this workflow on that tag
# (`gh workflow run mf-desktop-build.yml --ref <tag>`). The fork sync creates
# its tags with GITHUB_TOKEN, which starts no workflow, so it uses the second
# form. Either way the tag supplies the version; set-version-from-tag.mjs
# patches the manifests at build time.
#
# macOS is built for Apple silicon only, so latest.json has no darwin-x86_64
# entry and Intel installs stop updating. macOS releases are signed with the
# fork's Developer ID certificate; the app and the DMG are notarized and
# stapled. Only a manual run with macos_signing=false builds an ad-hoc app.
# Windows installers have no Authenticode signature, so SmartScreen warns on
# first install. Both still carry the Tauri updater signature.
#
# A manual run with publish=false is a dry run: it builds only the macOS apps
# from the chosen branch (version <core>-mf.0, no tag needed), keeps them as
# workflow artifacts, and publishes and announces nothing.
#
# A manual run with channel=canary builds every platform from the chosen branch
# as version <core>-canary.<run number> (no tag), bakes the canary feed
# buzz-desktop-canary/latest.json into the app, and publishes only under that
# CDN folder. It prunes nothing and sends no notice. The production feed and
# folder stay untouched.

concurrency:
  group: mf-desktop-build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'desktop-v[0-9]*-mf.[0-9]*'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Wasabi and notify. False is a dry run that builds only the macOS apps from the chosen branch."
        required: false
        default: true
        type: boolean
      macos_signing:
        description: "Sign the macOS app and DMG with the Developer ID certificate and notarize them. Releases are signed; false builds an ad-hoc test app."
        required: false
        default: true
        type: boolean
      channel:
        description: "Update feed. canary builds from the chosen branch and publishes to the buzz-desktop-canary/ CDN folder for update tests."
        required: false
        default: production
        type: choice
        options:
          - production
          - canary

permissions:
  contents: read

env:
  # The Wasabi account blocks anonymous reads, so clients download through a
  # CDN that serves the bucket root: https://<cdn>/<key> maps to s3://<bucket>/<key>.
  BUZZ_UPDATER_ENDPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'canary' && 'https://gamestudio.mobigame.vn/buzz-desktop-canary/latest.json' || 'https://gamestudio.mobigame.vn/buzz-desktop/latest.json' }}
  WASABI_ENDPOINT: https://s3.ap-southeast-1.wasabisys.com
  WASABI_BUCKET: game-mobile-registry
  BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
  # Tag pushes have no inputs: they publish and they sign.
  MF_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
  # Tag pushes and runs started on a release tag sign; only a manual run can
  # turn signing off.
  MF_MACOS_SIGNING: ${{ github.event_name != 'workflow_dispatch' || inputs.macos_signing }}
  MF_CANARY: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'canary' }}

jobs:
  setup:
    name: Setup
    if: github.repository == 'kevinle128/buzz'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version || steps.dry_version.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Determine version
        id: version
        if: env.MF_DRY_RUN != 'true' && env.MF_CANARY != 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-mf\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION'. Expected X.Y.Z-mf.N (e.g. 0.5.26-mf.1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # Untagged builds: a dry run is <core>-mf.0; a canary is
      # <core>-canary.<run number>, so each canary is newer than the last.
      - name: Determine dry-run version
        id: dry_version
        if: env.MF_DRY_RUN == 'true' || env.MF_CANARY == 'true'
        run: |
          core=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          if [[ "$MF_CANARY" == true ]]; then
            echo "version=${core}-canary.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${core}-mf.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag-bound source
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$MF_DRY_RUN" != true && "$MF_CANARY" != true ]]; then
            scripts/verify-release-ref.sh desktop-v "$VERSION"
          fi
          echo "source_sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      # Fail before the long builds rather than at publish time.
      - name: Check release secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WASABI_ACCESS_KEY_ID: ${{ secrets.WASABI_ACCESS_KEY_ID }}
          WASABI_SECRET_ACCESS_KEY: ${{ secrets.WASABI_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          [[ -n "$BUZZ_UPDATER_PUBLIC_KEY" ]] || missing+=(BUZZ_UPDATER_PUBLIC_KEY)
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          [[ -n "$WASABI_ACCESS_KEY_ID" ]] || missing+=(WASABI_ACCESS_KEY_ID)
          [[ -n "$WASABI_SECRET_ACCESS_KEY" ]] || missing+=(WASABI_SECRET_ACCESS_KEY)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: [self-hosted, macOS, ARM64, buzz]
    needs: setup
    # Holds the Apple signing secrets; they are read only when macos_signing is on.
    environment: desktop-signing
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # The fork ships macOS for Apple silicon only; Intel Macs get no
          # build. Upstream ships mesh-llm (Metal) only on Apple Silicon.
          - arch: aarch64
            target: aarch64-apple-darwin
            features: --features mesh-llm
            mesh: true
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      # The mini also runs the Paseo desktop build through its own runner. Both
      # jobs take this lock, so only one desktop build runs on the mini at a
      # time. lockf holds the lock while its child sleeps; the clean step kills
      # the child, and the runner kills it when the job ends, so a cancelled
      # job also frees the lock.
      - name: Wait for the mini build lock
        run: |
          set -euo pipefail
          lock="$HOME/.mini-desktop-build.lock"
          ready="$RUNNER_TEMP/mini-build-lock.pid"
          rm -f "$ready"
          # shellcheck disable=SC2016 # $$ and $1 expand in the child shell.
          nohup /usr/bin/lockf -k -t 3600 "$lock" /bin/sh -c 'echo $$ > "$1"; exec sleep 21600' sh "$ready" \
            > /dev/null 2>&1 &
          holder=$!
          for _ in $(seq 3600); do
            [[ -s "$ready" ]] && break
            kill -0 "$holder" 2> /dev/null || { echo "::error::Gave up waiting for the mini build lock after 1 hour"; exit 1; }
            sleep 1
          done
          [[ -s "$ready" ]] || { echo "::error::The mini build lock was not taken"; exit 1; }
          echo "MINI_BUILD_LOCK_PID_FILE=$ready" >> "$GITHUB_ENV"
          echo "Took the mini build lock."

      - name: Check free disk space
        run: |
          set -euo pipefail
          min_gib=25
          free_gib=$(( $(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}') / 1024 / 1024 ))
          echo "Free space for the workspace: ${free_gib} GiB (need ${min_gib} GiB)."
          if (( free_gib < min_gib )); then
            echo "::error::Only ${free_gib} GiB free on the mini; a desktop build needs ${min_gib} GiB"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound source
        if: env.MF_DRY_RUN != 'true' && env.MF_CANARY != 'true'
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      # Keep Hermit packages and the pnpm store inside the job temp dir so the
      # clean step removes them and shared caches on the host stay untouched.
      - name: Use job-local caches
        run: |
          echo "HERMIT_STATE_DIR=$RUNNER_TEMP/mf-cache/hermit" >> "$GITHUB_ENV"
          echo "pnpm_config_store_dir=$RUNNER_TEMP/mf-cache/pnpm-store" >> "$GITHUB_ENV"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Add Rust target
        run: rustup target add "$TARGET"

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs

      - name: Build sidecars
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      # Mesh rev derived from Cargo.lock; cache key tracks it.
      - name: Resolve mesh-llm rev
        if: matrix.mesh
        id: mesh_rev
        run: |
          set -euo pipefail
          # awk instead of python tomllib: the runner's system python3 may predate 3.11.
          REV=$(awk '/^name = "mesh-llm-sdk"$/{f=1} f&&/^source = /{s=$3; gsub(/"/,"",s); sub(/.*#/,"",s); print s; exit}' Cargo.lock)
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build mesh llama native libraries
        if: matrix.mesh
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$MESH_REV_SHORT" -type d -name "$MESH_REV_SHORT" | head -1)
          [[ -n "$MESH_ROOT" ]] || { echo "::error::mesh-llm checkout for $MESH_REV_SHORT not found after cargo fetch"; exit 1; }
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      # Signing can add a keychain to the user search list and change the
      # default keychain; the clean step puts both back.
      - name: Save the keychain settings
        run: |
          security list-keychains -d user | tr -d '"' | xargs -n1 > "$RUNNER_TEMP/keychain-search-list.txt"
          security default-keychain -d user | tr -d '" ' > "$RUNNER_TEMP/keychain-default.txt"

      # codesign must build the chain leaf -> Developer ID G2 -> Apple Root CA.
      # The Mac has only the root. Tauri imports the .p12 (with G2) into a new
      # keychain for each signing pass and deletes it afterwards; the second
      # pass, for the DMG, then failed with "unable to build chain to
      # self-signed root" (errSecInternalComponent). A job keychain holding the
      # public G2 certificate from Apple stays in the search list for the whole
      # job; the clean step deletes it with the other added keychains.
      - name: Add the Developer ID G2 certificate authority
        if: env.MF_MACOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL --retry 3 -o "$cert" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $cert" | shasum -a 256 -c -
          keychain="$RUNNER_TEMP/developer-id-ca.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security add-certificates -k "$keychain" "$cert"
          # shellcheck disable=SC2046
          security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychain-search-list.txt") "$keychain"
          security list-keychains -d user

      # Without macos_signing, Tauri signs ad hoc with Entitlements.plist. With
      # it, Tauri imports the Developer ID certificate, signs the sidecars and
      # the app with the hardened runtime, then notarizes and staples the app;
      # the App Store Connect key goes to notarytool as a file path.
      - name: Build Tauri app
        run: |
          set -euo pipefail
          if [[ "$MF_MACOS_SIGNING" == true ]]; then
            key_dir="$RUNNER_TEMP/private_keys"
            (umask 077 && mkdir -p "$key_dir")
            export APPLE_API_KEY_PATH="$key_dir/AuthKey_${FORK_APPLE_API_KEY_ID}.p8"
            (umask 077 && printf '%s' "$FORK_APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH")
            export APPLE_CERTIFICATE="$FORK_APPLE_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$FORK_APPLE_CERTIFICATE_PASSWORD"
            export APPLE_API_KEY="$FORK_APPLE_API_KEY_ID"
            export APPLE_API_ISSUER="$FORK_APPLE_API_ISSUER"
          else
            export APPLE_SIGNING_IDENTITY="-"
          fi
          unset FORK_APPLE_CERTIFICATE FORK_APPLE_CERTIFICATE_PASSWORD FORK_APPLE_API_KEY_P8_BASE64
          # Tauri's verbose log prints the password of its temporary signing
          # keychain, so a signed build runs without --verbose.
          verbose_flag=--verbose
          if [[ "$MF_MACOS_SIGNING" == true ]]; then verbose_flag=; fi
          # shellcheck disable=SC2086 # an empty flag must expand to no argument.
          cd desktop && pnpm tauri build $verbose_flag --target "$TARGET" ${{ matrix.features }} --config src-tauri/tauri.release.conf.json
        env:
          FORK_APPLE_CERTIFICATE: ${{ env.MF_MACOS_SIGNING == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          FORK_APPLE_CERTIFICATE_PASSWORD: ${{ env.MF_MACOS_SIGNING == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          FORK_APPLE_API_KEY_ID: ${{ env.MF_MACOS_SIGNING == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          FORK_APPLE_API_ISSUER: ${{ env.MF_MACOS_SIGNING == 'true' && secrets.APPLE_API_ISSUER || '' }}
          FORK_APPLE_API_KEY_P8_BASE64: ${{ env.MF_MACOS_SIGNING == 'true' && secrets.APPLE_API_KEY_P8_BASE64 || '' }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          # No TAURI_BUNDLER_DMG_IGNORE_CI: the Finder layout step needs a GUI session
          # and Automation permission, which the launchd runner does not have.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify signature and entitlements
        env:
          APPLE_TEAM_ID: ${{ env.MF_MACOS_SIGNING == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          APP="desktop/src-tauri/target/${TARGET}/release/bundle/macos/Buzz.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          desktop/scripts/verify-macos-entitlements.sh "$APP"
          [[ "$MF_MACOS_SIGNING" == true ]] || exit 0
          # Tauri only warns and goes on when it cannot notarize, so the signed
          # build fails here unless Apple accepted it.
          team="$(codesign -dv "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          [[ "$team" == "$APPLE_TEAM_ID" ]] || { echo "::error::The app is not signed by the APPLE_TEAM_ID team"; exit 1; }
          echo "TeamIdentifier matches APPLE_TEAM_ID."
          codesign -dv "$APP" 2>&1 | grep -E '^Runtime Version=' || { echo "::error::The app has no hardened runtime"; exit 1; }
          for bin in "$APP"/Contents/MacOS/*; do
            bin_team="$(codesign -dv "$bin" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            [[ "$bin_team" == "$APPLE_TEAM_ID" ]] || { echo "::error::$(basename "$bin") is not signed by the APPLE_TEAM_ID team"; exit 1; }
          done
          echo "Every binary in Contents/MacOS is signed by the same team."
          spctl_out="$(spctl -a -vvv -t exec "$APP" 2>&1)" || true
          echo "$spctl_out"
          grep -q 'source=Notarized Developer ID' <<< "$spctl_out" \
            || { echo "::error::Gatekeeper does not report a notarized Developer ID app"; exit 1; }
          xcrun stapler validate "$APP"

      # Tauri signs the DMG but notarizes only the app, so the downloaded DMG
      # would fail Gatekeeper. It is notarized and stapled here; latest.json
      # does not name the DMG, so nothing else changes.
      - name: Notarize and staple the DMG
        if: env.MF_MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          [[ -s "$key" ]] || { echo "::error::The App Store Connect key file is missing"; exit 1; }
          for dmg in "desktop/src-tauri/target/${TARGET}"/release/bundle/dmg/*.dmg; do
            result="$(xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" --wait --output-format json)"
            status="$(jq -r .status <<< "$result")"
            echo "$(basename "$dmg"): notarization ${status} ($(jq -r .id <<< "$result"))"
            [[ "$status" == Accepted ]] || { echo "::error::Apple did not accept $(basename "$dmg")"; exit 1; }
            xcrun stapler staple "$dmg"
            codesign --verify --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
            # The check Gatekeeper runs when a user opens the downloaded DMG.
            dmg_out="$(spctl -a -vvv -t open --context context:primary-signature "$dmg" 2>&1)" || true
            echo "$dmg_out"
            grep -q 'source=Notarized Developer ID' <<< "$dmg_out" \
              || { echo "::error::Gatekeeper does not accept $(basename "$dmg") as a notarized Developer ID disk image"; exit 1; }
          done

      - name: Locate build artifacts
        id: artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          [[ -n "$DMG" ]] || { echo "::error::No DMG found in $BUNDLE_DIR/dmg"; exit 1; }

          ARCHIVE=$(find "$BUNDLE_DIR/macos" -name '*.tar.gz' ! -name '*.sig' -type f | head -1)
          [[ -n "$ARCHIVE" && -f "${ARCHIVE}.sig" ]] || { echo "::error::Updater archive or signature not found in $BUNDLE_DIR/macos"; exit 1; }
          # Give each architecture a unique basename before artifacts are merged.
          RENAMED="$(dirname "$ARCHIVE")/Buzz_${VERSION}_${ARCH}.app.tar.gz"
          if [[ "$ARCHIVE" != "$RENAMED" ]]; then
            mv "$ARCHIVE" "$RENAMED"
            mv "${ARCHIVE}.sig" "${RENAMED}.sig"
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "archive=$RENAMED" >> "$GITHUB_OUTPUT"
          echo "sig=${RENAMED}.sig" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ${{ steps.artifacts.outputs.dmg }}
            ${{ steps.artifacts.outputs.archive }}
            ${{ steps.artifacts.outputs.sig }}

      # Self-hosted runners keep the workspace between runs; free the disk after every build.
      - name: Clean workspace
        if: always()
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          # Hermit installs packages read-only; make them writable before removal.
          if [[ -d "$RUNNER_TEMP/mf-cache" ]]; then chmod -R u+w "$RUNNER_TEMP/mf-cache"; fi
          rm -rf "$RUNNER_TEMP/mf-cache" "$RUNNER_TEMP/private_keys"
          # Undo keychain changes from signing: drop every keychain that is not
          # in the saved list, then put the list and the default keychain back.
          if [[ -s "$RUNNER_TEMP/keychain-search-list.txt" ]]; then
            security list-keychains -d user | tr -d '"' | xargs -n1 | while IFS= read -r keychain; do
              grep -Fxq "$keychain" "$RUNNER_TEMP/keychain-search-list.txt" || security delete-keychain "$keychain" 2> /dev/null || true
            done
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychain-search-list.txt")
          fi
          if [[ -s "$RUNNER_TEMP/keychain-default.txt" ]]; then
            security default-keychain -d user -s "$(cat "$RUNNER_TEMP/keychain-default.txt")"
          fi
          rm -f "$RUNNER_TEMP/keychain-search-list.txt" "$RUNNER_TEMP/keychain-default.txt"
          if [[ -s "${MINI_BUILD_LOCK_PID_FILE:-}" ]]; then
            kill "$(cat "$MINI_BUILD_LOCK_PID_FILE")" 2> /dev/null || true
            rm -f "$MINI_BUILD_LOCK_PID_FILE"
            echo "Released the mini build lock."
          fi

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    # Pinned build environment, the same image as upstream release.yml.
    container: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
    needs: setup
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      # AppImage tools are AppImages themselves; containers lack FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 \
            build-essential ca-certificates curl desktop-file-utils file git \
            libasound2-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config \
            squashfs-tools wget xdg-utils

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace safe for git (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify tag-bound source
        if: env.MF_CANARY != 'true'
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install appimagetool
        run: |
          set -euo pipefail
          # Pinned release tags and hashes, same as upstream release.yml.
          wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum -c
          install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs

      - name: Build Linux Tauri app
        run: cd desktop && pnpm tauri build --verbose --ci --bundles deb,appimage --features mesh-llm --config src-tauri/tauri.release.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Fix AppImage (remove infra libs, shim host GStreamer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mapfile -t APPIMAGES < <(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f)
          [[ ${#APPIMAGES[@]} -eq 1 ]] || { echo "::error::Expected exactly one AppImage, found ${#APPIMAGES[@]}"; exit 1; }
          bash desktop/scripts/fix-appimage.sh "${APPIMAGES[0]}"

      - name: Locate Linux build artifacts
        id: artifacts
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          DEB=$(find "$BUNDLE_DIR/deb" -name '*.deb' -type f | head -1)
          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage' -type f | head -1)
          [[ -n "$DEB" && -n "$APPIMAGE" ]] || { echo "::error::DEB or AppImage missing in $BUNDLE_DIR"; exit 1; }
          # Tauri 2.11+ signs the AppImage directly; older versions wrap it in a tar.gz.
          ARCHIVE=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage.tar.gz' ! -name '*.sig' -type f | head -1)
          [[ -n "$ARCHIVE" ]] || ARCHIVE="$APPIMAGE"
          [[ -f "${ARCHIVE}.sig" ]] || { echo "::error::Updater signature not found for $ARCHIVE"; exit 1; }
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sig=${ARCHIVE}.sig" >> "$GITHUB_OUTPUT"

      # .deb is not auto-updatable; only the AppImage is.
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-linux-x64
          if-no-files-found: error
          path: |
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.archive }}
            ${{ steps.artifacts.outputs.sig }}

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: setup
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound source
        if: env.MF_CANARY != 'true'
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      # Hermit has no Windows support, so pin the toolchain the same way as
      # upstream release.yml.
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      # No dependency cache: a writable cache in a job that signs updater
      # artifacts is a poisoning vector.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs

      # buzz-backend-kubernetes does not ship on Windows; see
      # tauri.windows.conf.json and bundle-sidecars.sh.
      - name: Build sidecars
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build Windows NSIS installer
        run: cd desktop && pnpm tauri build --verbose --target "$TARGET" --bundles nsis --config src-tauri/tauri.release.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate build artifacts
        id: artifacts
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          EXE=$(find "$BUNDLE_DIR/nsis" -name '*.exe' -type f | head -1)
          [[ -n "$EXE" ]] || { echo "::error::No NSIS installer found in $BUNDLE_DIR/nsis"; exit 1; }
          # The NSIS installer is also the updater artifact; Tauri signs it in place.
          [[ -f "${EXE}.sig" ]] || { echo "::error::Updater signature not found: ${EXE}.sig"; exit 1; }
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "sig=${EXE}.sig" >> "$GITHUB_OUTPUT"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-windows-x64
          if-no-files-found: error
          path: |
            ${{ steps.artifacts.outputs.exe }}
            ${{ steps.artifacts.outputs.sig }}

  # Runs only when every platform built, so latest.json never names a missing
  # artifact. Versioned objects go up first and latest.json last, so clients
  # never see a manifest that points at files still uploading.
  publish:
    name: Publish to Wasabi
    runs-on: ubuntu-latest
    needs: [setup, build-macos, build-linux, build-windows]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      AWS_ACCESS_KEY_ID: ${{ secrets.WASABI_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.WASABI_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Upload versioned artifacts
        id: upload
        run: |
          set -euo pipefail
          # BUZZ_UPDATER_ENDPOINT is https://<cdn>/<prefix>/latest.json, and the
          # CDN path is the object key. Derive every location from it so the
          # manifest URLs and the upload target cannot drift apart.
          path="${BUZZ_UPDATER_ENDPOINT#https://}"
          prefix="$(dirname "${path#*/}")"
          release_dir="${prefix}/v${VERSION}"
          base_url="$(dirname "$BUZZ_UPDATER_ENDPOINT")/v${VERSION}"

          # Each updater artifact must match exactly one signed file, so a
          # missing or duplicate bundle fails here instead of in latest.json.
          one() {
            local matches
            mapfile -t matches < <(find dist -type f -name "$1")
            if [[ ${#matches[@]} -ne 1 || ! -f "${matches[0]}.sig" ]]; then
              echo "::error::Expected one signed '$1' in dist, found ${#matches[@]}" >&2
              return 1
            fi
            echo "${matches[0]}"
          }
          mac_arm=$(one "Buzz_${VERSION}_aarch64.app.tar.gz")
          # Tauri 2.11+ signs the AppImage directly; older versions wrap it in a tar.gz.
          if find dist -type f -name '*.AppImage.tar.gz' | grep -q .; then
            linux=$(one '*.AppImage.tar.gz')
          else
            linux=$(one '*.AppImage')
          fi
          windows=$(one '*-setup.exe')

          find dist -type f -print0 | while IFS= read -r -d '' file; do
            aws s3 cp "$file" "s3://${WASABI_BUCKET}/${release_dir}/$(basename "$file")" \
              --endpoint-url "$WASABI_ENDPOINT" --only-show-errors
          done

          desktop/scripts/generate-oss-latest-json.sh "$VERSION" \
            "darwin-aarch64:${mac_arm}.sig:${base_url}/$(basename "$mac_arm")" \
            "linux-x86_64:${linux}.sig:${base_url}/$(basename "$linux")" \
            "windows-x86_64:${windows}.sig:${base_url}/$(basename "$windows")" \
            > latest.json
          cat latest.json

          echo "manifest=s3://${WASABI_BUCKET}/${prefix}/latest.json" >> "$GITHUB_OUTPUT"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"

      - name: Publish latest.json
        env:
          MANIFEST: ${{ steps.upload.outputs.manifest }}
        run: |
          aws s3 cp latest.json "$MANIFEST" \
            --endpoint-url "$WASABI_ENDPOINT" \
            --content-type application/json \
            --cache-control no-cache \
            --only-show-errors

      # Keeps only the newest fork versions in the release storage. latest.json
      # now names this version, so the plan deletes nothing unless this version
      # is among those kept. Only whole v<version>/ folders go, never a file at
      # the prefix root such as latest.json. A failed prune never turns a
      # published release red.
      - name: Delete older versions
        id: prune
        if: env.MF_CANARY != 'true'
        continue-on-error: true
        env:
          PREFIX: ${{ steps.upload.outputs.prefix }}
          KEEP: "3"
        run: |
          set -euo pipefail
          listing="${RUNNER_TEMP}/release-listing.txt"
          delete_list="${RUNNER_TEMP}/release-delete.txt"
          if ! aws s3 ls "s3://${WASABI_BUCKET}/${PREFIX}/" --endpoint-url "$WASABI_ENDPOINT" > "${listing}.raw"; then
            echo "::warning::Could not list the release storage; nothing is deleted."
            exit 0
          fi
          # Version folders are v<version>/; the plan works on bare versions and
          # never sees a folder without the prefix.
          sed -n 's#^\([[:space:]]*PRE \)v\(.*/\)$#\1\2#p' "${listing}.raw" > "$listing"
          node scripts/fork-desktop-backup-prune.mjs --listing "$listing" --keep "$KEEP" \
            --current "$VERSION" --out "$delete_list"
          while IFS= read -r version; do
            [[ -n "$version" ]] || continue
            aws s3 rm "s3://${WASABI_BUCKET}/${PREFIX}/v${version}/" --recursive \
              --endpoint-url "$WASABI_ENDPOINT" --only-show-errors
            echo "Deleted v${version}"
          done < "$delete_list"

  notify:
    name: Notify Buzz
    needs: [setup, publish]
    if: ${{ always() && github.repository == 'kevinle128/buzz' && needs.setup.result != 'skipped' && (github.event_name != 'workflow_dispatch' || (inputs.publish && inputs.channel != 'canary')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Compose message
        id: compose
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERSION: ${{ needs.setup.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_RESULT" == "success" ]]; then
            event=release.published
            key=release-published
            text="🚀 Buzz fork desktop ${VERSION} đã sẵn sàng. Các bản desktop đã cài sẽ tự cập nhật."$'\n'"Run: ${RUN_URL}"
          else
            event=build.failed
            key=build-failed
            text="❌ Build Buzz fork desktop ${VERSION:+${VERSION} }thất bại (${PUBLISH_RESULT}). Log: ${RUN_URL}"
          fi
          delimiter="TEXT_$(openssl rand -hex 8)"
          {
            echo "event=${event}"
            echo "key=${key}"
            echo "text<<${delimiter}"
            echo "$text"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Buzz
        uses: ./.github/actions/buzz-notify
        with:
          event_type: ${{ steps.compose.outputs.event }}
          content: ${{ steps.compose.outputs.text }}
          repository_name: ${{ vars.BUZZ_REPOSITORY_NAME }}
          idempotency_key: ${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.compose.outputs.key }}
          callback_url: ${{ secrets.BUZZ_APP_CALLBACK_URL }}
          app_secret: ${{ secrets.BUZZ_APP_SECRET }}
          ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
