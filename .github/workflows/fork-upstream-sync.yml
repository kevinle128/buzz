name: Fork Upstream Sync

# Entry point of the fork's daily upstream sync. GitHub dispatches a workflow
# from a branch only when the same file exists on the default branch, so this
# file comes first with a manual trigger and no work. The sync itself replaces
# this file. Only the fork runs this.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build even when upstream has nothing new and the fork has no unreleased commit."
        required: false
        default: false
        type: boolean
      test_fork_sha:
        description: "Test only: replay a conflict from this fork commit (40-character SHA). A test run never pushes or builds."
        required: false
        default: ""
        type: string
      test_upstream_sha:
        description: "Test only: the upstream commit (40-character SHA) to merge into test_fork_sha."
        required: false
        default: ""
        type: string
      test_mention:
        description: "Test only: mention the resolver in the Buzz notice. This wakes the agent."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'kevinle128/buzz'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report that the sync is not installed
        run: echo "The upstream sync is not installed on this branch yet; nothing to do."
